<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ chatbot_title }}</title>
    <style>
        :root {
            --bg: #eef3f8;
            --panel: rgba(255, 255, 255, 0.94);
            --panel-strong: #ffffff;
            --text: #172033;
            --muted: #6b7280;
            --line: #e4e9f0;
            --accent: #2563eb;
            --accent-dark: #1d4ed8;
            --user: #2563eb;
            --assistant: #f5f7fb;
            --danger: #b42318;
            --shadow: 0 24px 70px rgba(31, 41, 55, 0.12);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 10% 10%, rgba(37, 99, 235, 0.13), transparent 28%),
                radial-gradient(circle at 90% 90%, rgba(14, 165, 233, 0.12), transparent 28%),
                var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .app {
            width: min(1080px, 100%);
            height: min(860px, calc(100vh - 48px));
            min-height: 620px;
            background: var(--panel);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 28px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(18px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 22px 26px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            background: rgba(255, 255, 255, 0.82);
        }

        .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }

        .logo {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            color: #fff;
            background: linear-gradient(135deg, var(--accent), #0ea5e9);
            box-shadow: 0 10px 24px rgba(37, 99, 235, 0.24);
            font-size: 22px;
            flex: 0 0 auto;
        }

        .brand h1 {
            margin: 0;
            font-size: clamp(17px, 2.2vw, 22px);
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status {
            color: #047857;
            background: #ecfdf5;
            border: 1px solid #d1fae5;
            padding: 8px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 34px clamp(16px, 5vw, 58px);
            scroll-behavior: smooth;
        }

        .welcome {
            max-width: 720px;
            margin: 8vh auto 0;
            text-align: center;
        }

        .welcome-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            display: grid;
            place-items: center;
            border-radius: 22px;
            font-size: 32px;
            background: #eff6ff;
            border: 1px solid #dbeafe;
        }

        .welcome h2 { margin: 0 0 10px; font-size: clamp(24px, 4vw, 34px); }
        .welcome p { margin: 0 auto; color: var(--muted); line-height: 1.7; max-width: 650px; }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 9px;
            margin-top: 24px;
        }

        .suggestion {
            border: 1px solid var(--line);
            background: #fff;
            color: #334155;
            border-radius: 999px;
            padding: 10px 14px;
            cursor: pointer;
            transition: 0.2s ease;
            font: inherit;
            font-size: 13px;
        }

        .suggestion:hover { border-color: #bfdbfe; transform: translateY(-1px); }

        .message-row { display: flex; margin: 0 0 22px; }
        .message-row.user { justify-content: flex-end; }
        .bubble {
            max-width: min(78%, 720px);
            padding: 13px 16px;
            border-radius: 18px;
            line-height: 1.62;
            font-size: 15px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
        .assistant .bubble {
            background: var(--assistant);
            border: 1px solid var(--line);
            border-bottom-left-radius: 6px;
        }
        .user .bubble {
            background: var(--user);
            color: #fff;
            border-bottom-right-radius: 6px;
            box-shadow: 0 9px 24px rgba(37, 99, 235, 0.2);
        }

        .typing {
            display: inline-flex;
            gap: 5px;
            align-items: center;
            padding: 14px 17px;
            border-radius: 18px;
            border-bottom-left-radius: 6px;
            background: var(--assistant);
            border: 1px solid var(--line);
        }
        .typing span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #94a3b8;
            animation: bounce 1.1s infinite ease-in-out;
        }
        .typing span:nth-child(2) { animation-delay: .15s; }
        .typing span:nth-child(3) { animation-delay: .3s; }
        @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }

        .composer-wrap {
            padding: 18px clamp(16px, 5vw, 58px) 22px;
            border-top: 1px solid var(--line);
            background: rgba(255,255,255,.88);
        }

        .composer {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            padding: 8px;
            background: #fff;
            border: 1px solid #dce3ec;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        }

        textarea {
            width: 100%;
            max-height: 150px;
            min-height: 46px;
            resize: none;
            border: 0;
            outline: 0;
            padding: 12px 12px 10px;
            font: inherit;
            color: var(--text);
            background: transparent;
            line-height: 1.45;
        }

        button.send {
            width: 46px;
            height: 46px;
            border: 0;
            border-radius: 14px;
            background: var(--accent);
            color: white;
            cursor: pointer;
            font-size: 18px;
            flex: 0 0 auto;
            transition: .2s ease;
        }
        button.send:hover { background: var(--accent-dark); transform: translateY(-1px); }
        button.send:disabled { opacity: .55; cursor: not-allowed; transform: none; }

        .hint { margin: 9px 4px 0; color: #94a3b8; font-size: 11px; text-align: right; }
        .error { color: var(--danger); background: #fff5f5; border-color: #fecaca !important; }

        @media (max-width: 700px) {
            body { padding: 0; }
            .app { height: 100vh; min-height: 100vh; border-radius: 0; }
            header { padding: 16px; }
            .status { display: none; }
            #chat { padding: 22px 14px; }
            .bubble { max-width: 88%; }
            .composer-wrap { padding: 12px 14px 16px; }
            .welcome { margin-top: 10vh; }
        }
    </style>
</head>
<body>
    <main class="app">
        <header>
            <div class="brand">
                <div class="logo" aria-hidden="true">✈</div>
                <h1 id="chatbot-title"></h1>
            </div>
            <div class="status">● AI Assistant</div>
        </header>

        <section id="chat" aria-live="polite">
            <div id="welcome" class="welcome">
                <div class="welcome-icon">🧭</div>
                <h2>Plan your next tour</h2>
                <p>Ask for destination ideas, itineraries, transportation planning, accommodation guidance, activities, budgeting, packing help, or anything else related to organizing your tour.</p>
                <div class="suggestions">
                    <button class="suggestion" data-prompt="Create a 3-day tour itinerary for me.">3-day itinerary</button>
                    <button class="suggestion" data-prompt="Help me organize a budget-friendly family tour.">Family tour</button>
                    <button class="suggestion" data-prompt="What details do you need from me to plan a tour?">Plan my tour</button>
                </div>
            </div>
        </section>

        <div class="composer-wrap">
            <form id="composer" class="composer">
                <textarea id="message" rows="1" maxlength="4000" placeholder="Ask about your tour..." aria-label="Message"></textarea>
                <button id="send" class="send" type="submit" aria-label="Send message">➤</button>
            </form>
            <div class="hint">Enter to send · Shift+Enter for a new line</div>
        </div>
    </main>

    <script>
        const chatbotTitle = {{ chatbot_title|tojson }};
        const chat = document.getElementById("chat");
        const welcome = document.getElementById("welcome");
        const form = document.getElementById("composer");
        const input = document.getElementById("message");
        const send = document.getElementById("send");
        const titleElement = document.getElementById("chatbot-title");

        let history = [];
        let waiting = false;

        titleElement.textContent = chatbotTitle;
        document.title = chatbotTitle;

        function scrollToBottom() {
            chat.scrollTop = chat.scrollHeight;
        }

        function addMessage(role, text, isError = false) {
            if (welcome) welcome.style.display = "none";

            const row = document.createElement("div");
            row.className = `message-row ${role}`;

            const bubble = document.createElement("div");
            bubble.className = `bubble${isError ? " error" : ""}`;
            bubble.textContent = text;

            row.appendChild(bubble);
            chat.appendChild(row);
            scrollToBottom();
        }

        function showTyping() {
            const row = document.createElement("div");
            row.className = "message-row assistant";
            row.id = "typing-row";
            row.innerHTML = '<div class="typing" aria-label="Assistant is typing"><span></span><span></span><span></span></div>';
            chat.appendChild(row);
            scrollToBottom();
        }

        function hideTyping() {
            document.getElementById("typing-row")?.remove();
        }

        function resizeInput() {
            input.style.height = "auto";
            input.style.height = Math.min(input.scrollHeight, 150) + "px";
        }

        async function sendMessage(rawText) {
            const message = rawText.trim();
            if (!message || waiting) return;

            waiting = true;
            send.disabled = true;
            input.disabled = true;

            addMessage("user", message);
            showTyping();
            input.value = "";
            resizeInput();

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message, history })
                });

                let data = {};
                try { data = await response.json(); } catch (_) {}

                hideTyping();

                if (!response.ok) {
                    throw new Error(data.error || "Unable to get a response.");
                }

                const reply = typeof data.reply === "string" ? data.reply.trim() : "";
                if (!reply) throw new Error("The assistant returned an empty response.");

                addMessage("assistant", reply);
                history.push({ role: "user", content: message });
                history.push({ role: "assistant", content: reply });

                // Keep the browser history aligned with the backend limit.
                if (history.length > 20) history = history.slice(-20);
            } catch (error) {
                hideTyping();
                addMessage("assistant", error.message || "Something went wrong. Please try again.", true);
            } finally {
                waiting = false;
                send.disabled = false;
                input.disabled = false;
                input.focus();
            }
        }

        form.addEventListener("submit", (event) => {
            event.preventDefault();
            sendMessage(input.value);
        });

        input.addEventListener("input", resizeInput);
        input.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                form.requestSubmit();
            }
        });

        document.querySelectorAll(".suggestion").forEach((button) => {
            button.addEventListener("click", () => sendMessage(button.dataset.prompt || ""));
        });

        resizeInput();
    </script>
</body>
</html>
